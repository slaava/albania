name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages (gh-pages branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Single static site — no build step, just assemble the files.
      - name: Prepare site
        run: |
          mkdir _site
          cp albania_roadtrip_mapa.html _site/index.html
          cp apple-touch-icon.png tisk.html mapa-*.png _site/
          cp manifest.webmanifest sw.js icon-192.png icon-512.png _site/
          touch _site/.nojekyll

      # Pages is configured as "deploy from branch: gh-pages" (switched during
      # the 2026-08-06 Actions outage — the branch build service kept working
      # when workflow-based deployments were stuck in queue).
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
