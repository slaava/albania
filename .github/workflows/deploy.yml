name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Single static HTML file — just serve it as index.html, no build step.
      - name: Prepare site
        run: |
          mkdir _site
          cp albania_roadtrip_mapa.html _site/index.html
          cp apple-touch-icon.png tisk.html mapa-*.png _site/
          cp manifest.webmanifest sw.js icon-192.png icon-512.png _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
